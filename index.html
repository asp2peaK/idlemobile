<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Королевство Idle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="title">🏰 <span id="kingdomName">Королевство</span></div>
      <div class="gold"><span class="coin">🪙</span><span id="gold">0</span></div>
      <div class="rate"><span id="gps">0</span> / сек · 👑 <span id="crowns">0</span></div>
    </header>

    <section class="castle-zone">
      <button id="tapBtn" class="tap" aria-label="Собрать налоги">
        <span class="castle">🏰</span>
      </button>
      <div class="tap-hint">Тапай — собирай налоги (+<span id="tapValue">1</span>)</div>
      <button id="merchant" class="merchant hidden">🧳</button>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="buildings">Постройки</button>
      <button class="tab" data-tab="upgrades">Улучшения</button>
      <button class="tab" data-tab="glory">Слава</button>
    </nav>

    <main>
      <div class="buy-mode">
        Покупать:
        <button class="mode active" data-mode="1">×1</button>
        <button class="mode" data-mode="10">×10</button>
        <button class="mode" data-mode="max">Макс</button>
      </div>
      <div id="buildings" class="panel"></div>
      <div id="upgrades" class="panel hidden"></div>
      <div id="glory" class="panel hidden"></div>
    </main>

    <div id="toast" class="toast hidden"></div>
    <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
